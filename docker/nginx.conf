server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  set $csp "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; media-src 'self' blob: data: https: http:; connect-src 'self' https: http: wss: ws:";
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy $csp always;
  location = / { return 302 /manager/; }
  location = /manager { return 302 /manager/; }
  location = /manager/config.js {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location ^~ /manager/assets/ { expires 1y; }
  location ~ ^/manager/.*\.[^/]+$ { try_files $uri =404; }
  location /manager/ { try_files $uri $uri/ /manager/index.html; }
}
