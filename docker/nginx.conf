server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location = / { return 302 /manager/; }
  location = /manager { return 302 /manager/; }
  location = /manager/config.js { add_header Cache-Control "no-store"; }
  location ~ ^/manager/.*\.[^/]+$ { try_files $uri =404; }
  location /manager/ { try_files $uri $uri/ /manager/index.html; }
}
