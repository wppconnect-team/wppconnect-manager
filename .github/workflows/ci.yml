name: Manager
on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Package static bundle
        run: |
          tar -czf wppconnect-manager.tar.gz -C dist .
          sha256sum wppconnect-manager.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: manager-bundle
          path: |
            wppconnect-manager.tar.gz
            SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: test-results
  docker:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: manager-test:local
      - name: Smoke image and runtime configuration
        run: |
          docker run -d --name manager-test -p 8080:80 -e MANAGER_SERVER_URL=https://server.example.test manager-test:local
          for n in $(seq 1 30); do curl -fsS http://localhost:8080/manager/ > /dev/null && break || sleep 1; done
          curl -fsS http://localhost:8080/manager/ | grep 'WPPConnect Manager'
          curl -fsS http://localhost:8080/manager/config.js | grep 'https://server.example.test'
          curl -fsS http://localhost:8080/manager/sessions/test | grep 'WPPConnect Manager'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/manager/missing.js)" = 404
      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          image=ghcr.io/wppconnect-team/wppconnect-manager
          docker tag manager-test:local "$image:${TAG#v}"
          docker tag manager-test:local "$image:latest"
          docker push "$image:${TAG#v}"
          docker push "$image:latest"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: manager-bundle
          path: bundle
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" bundle/* --verify-tag --title "WPPConnect Manager $TAG" --generate-notes
